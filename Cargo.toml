[package]
name = "acoustid"
version = "0.1.1"
edition = "2024"
authors = ["Crystal Keck"]
description = "A Rust client for interacting with the AcoustID API."
repository = "https://github.com/CrystalKeck27/acoustid"
license = "MIT"

[dependencies]
governor = "0.10"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
